<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<title>My issues - FixMyCampus</title>
</head>
<body>
<div id="nav"></div>

<main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <div>
      <h1 class="h3 mb-1">My issues</h1>
      <p class="text-muted mb-0">Everything you have reported, and where it stands.</p>
    </div>
    <a class="btn btn-primary" href="report.html">Report an issue</a>
  </div>

  <div class="row g-3 mb-4" id="stats"></div>

  <div class="d-flex align-items-center gap-2 mb-3">
    <label class="form-label mb-0" for="filter">Show</label>
    <select id="filter" class="form-select form-select-sm" style="width:auto">
      <option value="">All issues</option>
      <option value="REPORTED">Reported</option>
      <option value="ASSIGNED">Assigned</option>
      <option value="IN_PROGRESS">In progress</option>
      <option value="RESOLVED">Resolved</option>
    </select>
  </div>

  <div id="list" class="d-grid gap-3"></div>
</main>

<div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0"><button type="button" class="btn-close ms-auto" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body pt-0" id="detailBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
  const user = requireLogin(false);
  let allIssues = [];
  let modal;

  if (user) {
    renderNav(user);
    modal = new bootstrap.Modal(document.getElementById('detailModal'));
    document.getElementById('filter').addEventListener('change', render);
    load();
  }

  async function load() {
    try {
      allIssues = await api('/api/issues/my');
      render();
    } catch (err) {
      notify(err.message, 'danger');
    }
  }

  function render() {
    const filter = document.getElementById('filter').value;

    const count = s => allIssues.filter(i => i.status === s).length;
    document.getElementById('stats').innerHTML = [
      ['Reported', count('REPORTED')], ['Assigned', count('ASSIGNED')],
      ['In progress', count('IN_PROGRESS')], ['Resolved', count('RESOLVED')]
    ].map(([label, n]) => `<div class="col-6 col-md-3"><div class="stat"><div class="num">${n}</div><div class="lbl">${label}</div></div></div>`).join('');

    const shown = filter ? allIssues.filter(i => i.status === filter) : allIssues;
    const list = document.getElementById('list');

    if (shown.length === 0) {
      list.innerHTML = allIssues.length === 0
        ? '<div class="panel text-center py-5"><p class="mb-3">You have not reported anything yet. Spotted something broken?</p><a class="btn btn-primary" href="report.html">Report an issue</a></div>'
        : '<div class="panel text-center text-muted">No issues with this status.</div>';
      return;
    }

    list.innerHTML = shown.map(i => `
      <article class="ticket s-${esc(i.status)}" tabindex="0" role="button" data-id="${i.id}">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-1">
          <h3>${esc(i.title)}</h3>
          <div class="d-flex align-items-center gap-3">${prioTag(i.priority)} ${statusBadge(i.status)}</div>
        </div>
        <div class="meta mb-3">${esc(LABEL.category[i.category])} &middot; ${esc(i.location)} &middot; ${esc(fmtDate(i.createdAt))}</div>
        ${trackerHtml(i.status)}
      </article>`).join('');

    list.querySelectorAll('.ticket').forEach(el => {
      const open = () => openDetail(el.dataset.id);
      el.addEventListener('click', open);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    });
  }

  async function openDetail(id) {
    try {
      const detail = await api('/api/issues/' + id);
      document.getElementById('detailBody').innerHTML = issueDetailHtml(detail);
      modal.show();
    } catch (err) {
      notify(err.message, 'danger');
    }
  }
</script>
</body>
</html>
