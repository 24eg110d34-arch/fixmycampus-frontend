<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<title>FixMyCampus - report campus problems and follow them to a fix</title>
</head>
<body>
<header class="topbar"><div class="container"><span class="brand">Fix<b>My</b>Campus</span></div></header>

<main class="container py-5">
  <div class="row g-5 align-items-center">
    <section class="col-lg-7 hero">
      <h1 class="mb-3">Broken fan in Block C? Report it in a minute.</h1>
      <p class="lead text-muted mb-4" style="max-width:34rem">Tell the maintenance team what is wrong and where. Then watch it move from reported to resolved.</p>

      <div class="sample-ticket" aria-hidden="true">
        <div class="d-flex justify-content-between align-items-start mb-1">
          <strong>Projector not turning on</strong>
          <span class="prio prio-HIGH">High</span>
        </div>
        <div class="text-muted small mb-3">Lab 204, Computer Science block</div>
        <ol class="track">
          <li class="done">Reported</li><li class="done">Assigned</li><li class="current">In progress</li><li>Resolved</li>
        </ol>
      </div>
    </section>

    <section class="col-lg-5">
      <div class="auth-card">
        <div class="auth-tabs" role="tablist">
          <button type="button" id="tabLogin" class="active" role="tab">Log in</button>
          <button type="button" id="tabRegister" role="tab">Create account</button>
        </div>

        <div id="authError" class="alert alert-danger py-2 d-none" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3"><label class="form-label" for="loginEmail">Email</label>
            <input class="form-control" id="loginEmail" type="email" autocomplete="username" required></div>
          <div class="mb-3"><label class="form-label" for="loginPassword">Password</label>
            <input class="form-control" id="loginPassword" type="password" autocomplete="current-password" required></div>
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>

        <form id="registerForm" class="d-none" novalidate>
          <div class="mb-3"><label class="form-label" for="regName">Full name</label>
            <input class="form-control" id="regName" autocomplete="name" required></div>
          <div class="mb-3"><label class="form-label" for="regEmail">Email</label>
            <input class="form-control" id="regEmail" type="email" autocomplete="email" required></div>
          <div class="mb-3"><label class="form-label" for="regPassword">Password (at least 6 characters)</label>
            <input class="form-control" id="regPassword" type="password" minlength="6" autocomplete="new-password" required></div>
          <div class="mb-3"><label class="form-label" for="regRole">I am a</label>
            <select class="form-select" id="regRole"><option value="STUDENT">Student</option><option value="STAFF">Staff member</option></select></div>
          <button class="btn btn-primary w-100" type="submit">Create account</button>
        </form>
      </div>
    </section>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
  const user = getUser();
  if (getToken() && user) window.location.href = homeFor(user);

  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');
  const errorBox = document.getElementById('authError');

  function showTab(login) {
    loginForm.classList.toggle('d-none', !login);
    registerForm.classList.toggle('d-none', login);
    document.getElementById('tabLogin').classList.toggle('active', login);
    document.getElementById('tabRegister').classList.toggle('active', !login);
    errorBox.classList.add('d-none');
  }
  document.getElementById('tabLogin').onclick = () => showTab(true);
  document.getElementById('tabRegister').onclick = () => showTab(false);

  function showError(message) { errorBox.textContent = message; errorBox.classList.remove('d-none'); }

  async function submitAuth(form, path, payload) {
    errorBox.classList.add('d-none');
    const button = form.querySelector('button[type=submit]');
    button.disabled = true;
    try {
      const data = await api(path, { method: 'POST', body: payload });
      saveSession(data);
      window.location.href = homeFor(data);
    } catch (err) {
      showError(err.message);
    } finally {
      button.disabled = false;
    }
  }

  loginForm.addEventListener('submit', e => {
    e.preventDefault();
    submitAuth(loginForm, '/api/auth/login', {
      email: document.getElementById('loginEmail').value,
      password: document.getElementById('loginPassword').value
    });
  });

  registerForm.addEventListener('submit', e => {
    e.preventDefault();
    submitAuth(registerForm, '/api/auth/register', {
      name: document.getElementById('regName').value,
      email: document.getElementById('regEmail').value,
      password: document.getElementById('regPassword').value,
      role: document.getElementById('regRole').value
    });
  });
</script>
</body>
</html>
