<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<title>Admin dashboard - FixMyCampus</title>
</head>
<body>
<div id="nav"></div>

<main class="container py-4">
  <div class="mb-4">
    <h1 class="h3 mb-1">Issue dashboard</h1>
    <p class="text-muted mb-0">Review reported issues, assign them to a department and move them to resolved.</p>
  </div>

  <div class="row g-3 mb-4" id="stats"></div>

  <div class="panel mb-4">
    <h2 class="h6 mb-3">Issues by category</h2>
    <div id="categories" class="row g-3"></div>
  </div>

  <div class="panel">
    <div class="row g-2 mb-3">
      <div class="col-md-4"><input id="fSearch" class="form-control form-control-sm" placeholder="Search title or location" aria-label="Search title or location"></div>
      <div class="col-6 col-md-2">
        <select id="fStatus" class="form-select form-select-sm" aria-label="Filter by status">
          <option value="">All statuses</option><option value="REPORTED">Reported</option><option value="ASSIGNED">Assigned</option>
          <option value="IN_PROGRESS">In progress</option><option value="RESOLVED">Resolved</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <select id="fCategory" class="form-select form-select-sm" aria-label="Filter by category">
          <option value="">All categories</option><option value="FURNITURE">Furniture</option><option value="ELECTRICAL">Lights &amp; fans</option>
          <option value="WATER_LEAKAGE">Water leakage</option><option value="CLEANLINESS">Cleanliness</option>
          <option value="NETWORK">Network</option><option value="OTHER">Other</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <select id="fPriority" class="form-select form-select-sm" aria-label="Filter by priority">
          <option value="">All priorities</option><option value="CRITICAL">Critical</option><option value="HIGH">High</option>
          <option value="MEDIUM">Medium</option><option value="LOW">Low</option>
        </select>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-issues align-middle mb-0">
        <thead><tr><th>#</th><th>Issue</th><th>Category</th><th>Priority</th><th>Status</th><th>Department</th><th>Reported</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="text-muted text-center py-4 mb-0 d-none">No issues match these filters.</p>
  </div>
</main>

<div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0"><button type="button" class="btn-close ms-auto" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body pt-0">
        <div id="detailBody"></div>
        <div id="manage" class="mt-4 pt-3 border-top"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
  const user = requireLogin(true);
  let departments = [];
  let modal;
  let openId = null;
  let searchTimer;

  if (user) {
    renderNav(user);
    modal = new bootstrap.Modal(document.getElementById('detailModal'));
    ['fStatus', 'fCategory', 'fPriority'].forEach(id => document.getElementById(id).addEventListener('change', loadIssues));
    document.getElementById('fSearch').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadIssues, 300); });
    init();
  }

  async function init() {
    try {
      departments = await api('/api/admin/departments');
      await Promise.all([loadStats(), loadIssues()]);
    } catch (err) { notify(err.message, 'danger'); }
  }

  async function loadStats() {
    const s = await api('/api/admin/stats');
    const open = s.total - s.byStatus.RESOLVED;
    document.getElementById('stats').innerHTML = [
      ['Total reported', s.total], ['Waiting for assignment', s.byStatus.REPORTED],
      ['Being worked on', s.byStatus.ASSIGNED + s.byStatus.IN_PROGRESS], ['Resolved', s.byStatus.RESOLVED]
    ].map(([label, n]) => `<div class="col-6 col-md-3"><div class="stat"><div class="num">${n}</div><div class="lbl">${label}</div></div></div>`).join('');

    const max = Math.max(1, ...Object.values(s.byCategory));
    document.getElementById('categories').innerHTML = Object.entries(s.byCategory).map(([key, n]) => `
      <div class="col-6 col-md-4 col-lg-2">
        <div class="small d-flex justify-content-between"><span>${esc(LABEL.category[key])}</span><strong>${n}</strong></div>
        <div class="catbar mt-1" style="width:${Math.round((n / max) * 100)}%;min-width:${n ? 6 : 0}px"></div>
      </div>`).join('');
  }

  async function loadIssues() {
    const params = new URLSearchParams();
    const add = (key, id) => { const v = document.getElementById(id).value.trim(); if (v) params.set(key, v); };
    add('q', 'fSearch'); add('status', 'fStatus'); add('category', 'fCategory'); add('priority', 'fPriority');

    try {
      const issues = await api('/api/admin/issues?' + params.toString());
      document.getElementById('empty').classList.toggle('d-none', issues.length > 0);
      const tbody = document.getElementById('rows');
      tbody.innerHTML = issues.map(i => `
        <tr tabindex="0" data-id="${i.id}">
          <td class="text-muted">${i.id}</td>
          <td><div class="fw-semibold">${esc(i.title)}</div><div class="small text-muted">${esc(i.location)}</div></td>
          <td>${esc(LABEL.category[i.category])}</td>
          <td>${prioTag(i.priority)}</td>
          <td>${statusBadge(i.status)}</td>
          <td>${i.departmentName ? esc(i.departmentName) : '<span class="text-muted">-</span>'}</td>
          <td class="small text-muted">${esc(i.reportedByName)}<br>${esc(fmtDate(i.createdAt))}</td>
        </tr>`).join('');

      tbody.querySelectorAll('tr').forEach(row => {
        const open = () => openIssue(row.dataset.id);
        row.addEventListener('click', open);
        row.addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
      });
    } catch (err) { notify(err.message, 'danger'); }
  }

  async function openIssue(id) {
    try {
      const detail = await api('/api/issues/' + id);
      openId = id;
      document.getElementById('detailBody').innerHTML = issueDetailHtml(detail);
      renderManage(detail.issue);
      modal.show();
    } catch (err) { notify(err.message, 'danger'); }
  }

  function renderManage(issue) {
    const box = document.getElementById('manage');
    if (issue.status === 'RESOLVED') {
      box.innerHTML = '<p class="mb-0 text-muted">This issue is resolved and closed.</p>';
      return;
    }

    const deptOptions = departments.map(d =>
      `<option value="${d.id}" ${d.id === issue.departmentId ? 'selected' : ''}>${esc(d.name)}</option>`).join('');
    const nextSteps = STEPS.filter(s => STEPS.indexOf(s) > STEPS.indexOf(issue.status))
      .map(s => `<option value="${s}">${esc(LABEL.status[s])}</option>`).join('');

    box.innerHTML = `
      <div class="row g-4">
        <div class="col-md-6">
          <h5 class="h6">Assign department</h5>
          <select id="deptSelect" class="form-select mb-2" aria-label="Department">${deptOptions}</select>
          <textarea id="assignNote" class="form-control mb-2" rows="2" maxlength="1000" placeholder="Note for the team (optional)"></textarea>
          <button class="btn btn-primary btn-sm" id="assignBtn">${issue.departmentId ? 'Reassign' : 'Assign'}</button>
        </div>
        <div class="col-md-6">
          <h5 class="h6">Update status</h5>
          <select id="statusSelect" class="form-select mb-2" aria-label="New status">${nextSteps}</select>
          <textarea id="statusNote" class="form-control mb-2" rows="2" maxlength="1000" placeholder="Progress note (required when resolving)"></textarea>
          <button class="btn btn-primary btn-sm" id="statusBtn" ${issue.departmentId ? '' : 'disabled'}>Update status</button>
          ${issue.departmentId ? '' : '<div class="form-text">Assign a department first.</div>'}
        </div>
      </div>`;

    document.getElementById('assignBtn').onclick = () => act('assign', {
      departmentId: Number(document.getElementById('deptSelect').value),
      remarks: document.getElementById('assignNote').value
    }, 'Issue assigned');

    document.getElementById('statusBtn').onclick = () => act('status', {
      status: document.getElementById('statusSelect').value,
      remarks: document.getElementById('statusNote').value
    }, 'Status updated');
  }

  async function act(path, body, successMessage) {
    try {
      await api(`/api/admin/issues/${openId}/${path}`, { method: 'PUT', body });
      notify(successMessage);
      await Promise.all([openIssue(openId), loadIssues(), loadStats()]);
    } catch (err) { notify(err.message, 'danger'); }
  }
</script>
</body>
</html>
