<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<title>Report an issue - FixMyCampus</title>
</head>
<body>
<div id="nav"></div>

<main class="container py-4" style="max-width:42rem">
  <h1 class="h3 mb-1">Report an issue</h1>
  <p class="text-muted mb-4">The more precisely you describe the place and the problem, the faster it gets fixed.</p>

  <form id="reportForm" class="panel" novalidate>
    <div class="mb-3">
      <label class="form-label" for="title">What is wrong?</label>
      <input class="form-control" id="title" name="title" maxlength="150" placeholder="Ceiling fan not working" required>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-sm-6">
        <label class="form-label" for="category">Category</label>
        <select class="form-select" id="category" name="category" required>
          <option value="FURNITURE">Furniture</option>
          <option value="ELECTRICAL">Lights &amp; fans</option>
          <option value="WATER_LEAKAGE">Water leakage</option>
          <option value="CLEANLINESS">Cleanliness</option>
          <option value="NETWORK">Network</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div class="col-sm-6">
        <label class="form-label" for="priority">How urgent is it?</label>
        <select class="form-select" id="priority" name="priority">
          <option value="LOW">Low - can wait</option>
          <option value="MEDIUM" selected>Medium - fix this week</option>
          <option value="HIGH">High - disrupting classes or work</option>
          <option value="CRITICAL">Critical - safety risk</option>
        </select>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="location">Where is it?</label>
      <input class="form-control" id="location" name="location" maxlength="150" placeholder="Block C, Room 112" required>
    </div>

    <div class="mb-3">
      <label class="form-label" for="description">Details</label>
      <textarea class="form-control" id="description" name="description" rows="4" maxlength="2000" placeholder="When did it start? Is anyone at risk?" required></textarea>
    </div>

    <div class="mb-4">
      <label class="form-label" for="image">Photo (optional, up to 5 MB)</label>
      <input class="form-control" id="image" name="image" type="file" accept="image/jpeg,image/png,image/gif,image/webp">
      <img id="preview" class="issue-photo mt-2 d-none" alt="Selected photo preview">
    </div>

    <div id="formError" class="alert alert-danger py-2 d-none" role="alert"></div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit" id="submitBtn">Submit issue</button>
      <a class="btn btn-outline-secondary" href="dashboard.html">Cancel</a>
    </div>
  </form>
</main>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
  const user = requireLogin(false);
  if (user) renderNav(user);

  const form = document.getElementById('reportForm');
  const fileInput = document.getElementById('image');
  const preview = document.getElementById('preview');
  const errorBox = document.getElementById('formError');

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (file) { preview.src = URL.createObjectURL(file); preview.classList.remove('d-none'); }
    else { preview.classList.add('d-none'); }
  });

  function fail(message) { errorBox.textContent = message; errorBox.classList.remove('d-none'); }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errorBox.classList.add('d-none');

    for (const id of ['title', 'location', 'description']) {
      if (!document.getElementById(id).value.trim()) { fail('Fill in the title, location and details.'); return; }
    }
    const file = fileInput.files[0];
    if (file && file.size > 5 * 1024 * 1024) { fail('The photo is larger than 5 MB.'); return; }

    const data = new FormData(form);
    if (!file) data.delete('image');

    const button = document.getElementById('submitBtn');
    button.disabled = true;
    try {
      await api('/api/issues', { method: 'POST', body: data });
      window.location.href = 'dashboard.html';
    } catch (err) {
      fail(err.message);
      button.disabled = false;
    }
  });
</script>
</body>
</html>
